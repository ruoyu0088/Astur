name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # astur.exe is the only binary: the settings editor is a Python script
      # (tools/astur_settings.py) that astur.exe starts with `python`.
      - name: Build release binary
        run: cargo build --release -p astur

      # astur.exe looks for astur_settings.py next to itself, so both files
      # sit at the root of the zip.
      - name: Package the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\astur.exe dist\
          Copy-Item tools\astur_settings.py dist\
          Compress-Archive -Path dist\astur.exe, dist\astur_settings.py -DestinationPath astur-windows-x64.zip -Force

      # Publish via the official gh CLI (preinstalled on the runner). softprops/
      # action-gh-release was repeatedly getting a GitHub 500 ("Unicorn" HTML page)
      # from the release-create API; gh uses a different client and is more robust.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @((Resolve-Path astur-windows-x64.zip).Path)
          $notes = "**Astur $env:GITHUB_REF_NAME** - tiling window manager for Windows 10/11.`n`n" +
                   "``astur-windows-x64.zip`` holds ``astur.exe`` and ``astur_settings.py``.`n`n" +
                   "Unpack it anywhere and run ``astur.exe``. The settings editor (``Astur Settings`` in the tray menu) " +
                   "needs Python 3 on PATH; if Python lives somewhere else, set ``settings_python`` in " +
                   "``%USERPROFILE%\.astur\astur.conf`` to the full path of python.exe.`n`n" +
                   "See the release commit for the full changelog."
          $ghArgs = @('release','create',$env:GITHUB_REF_NAME) + $files +
                    @('--title',"Astur $env:GITHUB_REF_NAME",'--notes',$notes)
          # Hyphenated semver tags (v2.0.0-alpha.1, -beta, -rc) publish as pre-releases.
          if ($env:GITHUB_REF_NAME -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
